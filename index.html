<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Chá de bebê do Yuri</title>

    <!-- As fontes são nossas, não do CDN do Google: um round-trip a menos no 4G
         do convidado. O preload existe porque o CSS que as declara só é
         descoberto depois do JS — sem ele, a Fraunces chega tarde e o título
         pisca em Georgia. -->
    <link
      rel="preload"
      href="/fontes/fraunces-900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fontes/jost-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fontes/fraunces-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fontes/fraunces-600-ital.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Card do WhatsApp. og:image PRECISA de URL absoluta: o crawler nao
         resolve caminho relativo. Ele tambem nao executa JavaScript, entao le
         so este HTML — e por isso gerar o preview nao marca visto_em. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chá de bebê do Yuri" />
    <meta
      property="og:description"
      content="Você foi convidado! Toque para ver o convite e confirmar presença."
    />
    <meta property="og:image" content="https://cha.silashenrique.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://cha.silashenrique.dev/" />
    <!-- O ursinho da aquarela redesenhado em vetor por scripts/favicon.py: em
         16px, que é o tamanho da aba, o recorte da ilustração vira uma mancha
         bege. O SVG atende quem sabe lê-lo; o PNG de 32 é a rede para quem
         não sabe; o apple-touch-icon é o único lugar onde o ícone aparece
         grande, na tela de início do iPhone. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f8f3e7" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
