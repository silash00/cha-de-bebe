# Mantém o projeto Supabase ativo: o free tier pausa após ~7 dias de baixa
# atividade, e a janela entre o disparo dos convites e o chá é de 24 dias.
#
# A chave abaixo é a publishable key, pública por natureza — ela já está no
# bundle JS que qualquer visitante do site baixa. Não usar secrets aqui é
# deliberado: um secret ausente faria este workflow falhar em silêncio, e o
# projeto pausaria sem ninguém perceber.
name: Keep Supabase alive

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

env:
  SUPABASE_URL: https://pemswwaebhidbwjaqjub.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_xZVxG7CdO5D_A9P9kcu3Fw_7CGEB8bp

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping get_convite
        run: |
          curl -sS --fail-with-body --max-time 30 \
            "$SUPABASE_URL/rest/v1/rpc/get_convite" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"p_token":"keepalive","p_preview":true}'
