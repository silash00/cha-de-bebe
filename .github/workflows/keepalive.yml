# Mantém o projeto Supabase ativo: o free tier pausa após ~7 dias de baixa
# atividade, e a janela entre o disparo dos convites e o chá é de 24 dias.
#
# URL e chave vêm dos secrets do repositório, para não deixar credencial em
# arquivo versionado. Se um deles faltar, o curl falha e o job fica vermelho —
# preferível a pausar o projeto em silêncio.
name: Keep Supabase alive

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping get_convite
        run: |
          curl -sS --fail-with-body --max-time 30 \
            "$SUPABASE_URL/rest/v1/rpc/get_convite" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"p_token":"keepalive","p_preview":true}'
